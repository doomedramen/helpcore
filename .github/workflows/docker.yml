name: Build & push Docker image

on:
  push:
    branches: [main]
  # Allow manual re-run from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → ghcr.io/martin/helpcore

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag :latest on main
            type=raw,value=latest,enable={{is_default_branch}}
            # Short SHA for rollback: ghcr.io/martin/helpcore:sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # Semver tags when you push a git tag (e.g. v0.2.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — avoids re-downloading crates on every run.
          # Note: BuildKit --mount=type=cache can't be used here (different cache layer),
          # so we use the gha cache backend instead.
          cache-from: type=gha
          cache-to: type=gha,mode=max
