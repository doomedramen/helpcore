# ── Quick-start reference ──────────────────────────────────────────────────────
#
# helpcore only:
#   docker compose up
#
# helpcore + Ollama (local LLM):
#   docker compose --profile with-ollama up
#   docker compose exec ollama ollama pull llama3
#
# helpcore + voice services (speaches STT/TTS, CPU-only):
#   docker compose --profile voice up
#
# helpcore + Ollama + voice:
#   docker compose --profile with-ollama --profile voice up
#
# helpcore + SearXNG (recommended self-hosted web search):
#   docker compose --profile search up
#   Configure the web-search plugin with provider "searxng" and
#   base URL "http://searxng:8080".
#
# helpcore + Whoogle (experimental; Google may block it):
#   docker compose --profile search-whoogle up
#   Configure provider "whoogle" and base URL "http://whoogle:5000".
#
# Use piper-http instead of speaches for TTS (set TTS_BACKEND=piper_http):
#   docker compose --profile with-ollama --profile voice-piper up
#
# Voice bridge (run natively, pointing at the containers above):
#   cd plugins/voice/bridge
#   cargo build --release
#   HELPCORE_URL=http://localhost:3000 \
#   STT_BACKEND=openai_compat STT_URL=http://localhost:8000 \
#   TTS_BACKEND=openai_compat TTS_URL=http://localhost:8000 \
#   ./target/release/voice-bridge
# ──────────────────────────────────────────────────────────────────────────────

services:
  helpcore:
    image: ghcr.io/doomedramen/helpcore:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
      - helpcore_data:/data
    environment:
      HELPCORE_CONFIG: /config/config.toml
      HELPCORE_DATA: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional: run Ollama alongside helpcore.
  # Start with: docker compose --profile with-ollama up
  # Then pull a model: docker compose exec ollama ollama pull llama3
  # Set url = "http://ollama:11434" in the [[providers]] section of config.toml.
  ollama:
    profiles: [with-ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      # Warn/error only. Set OLLAMA_DEBUG=0 to restore Ollama's info logs.
      OLLAMA_DEBUG: "${OLLAMA_DEBUG:--1}"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ── Voice (STT / TTS services) ───────────────────────────────────────────────
  # Start with: docker compose --profile voice up
  # Run the voice bridge binary separately; point it at these services.

  # Speaches: OpenAI-compatible STT (faster-whisper) + TTS (Piper/Kokoro) — CPU only.
  # https://github.com/speaches-ai/speaches
  speaches:
    profiles: [voice]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "8000:8000"
    volumes:
      - speaches_data:/home/user/.cache
    restart: unless-stopped

  # Optional: artibex/piper-http (standalone Piper TTS, simple GET API).
  # Start with: docker compose --profile voice-piper up
  # Then set TTS_BACKEND=piper_http and TTS_URL=http://piper:5000 in voice-bridge.
  # Voice list: https://github.com/rhasspy/piper/blob/master/VOICES.md
  piper:
    profiles: [voice-piper]
    image: artibex/piper-http:latest
    ports:
      - "5000:5000"
    environment:
      MODEL_DOWNLOAD_LINK: "${PIPER_MODEL_URL:-https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx}"
    restart: unless-stopped

  # Recommended self-hosted search backend. JSON output is enabled by the
  # embedded settings file below; this private deployment does not need Valkey.
  searxng:
    profiles: [search]
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_HOST_PORT:-8080}:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-helpcore-local-search-change-me}"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    volumes:
      - searxng_data:/var/cache/searxng
    restart: unless-stopped

  # Experimental fallback. Whoogle's final release warns that Google often
  # blocks its no-JavaScript scraping, so prefer SearXNG for reliable use.
  whoogle:
    profiles: [search-whoogle]
    image: ${WHOOGLE_IMAGE:-benbusby/whoogle-search:1.2.4}
    ports:
      - "${WHOOGLE_BIND_ADDRESS:-127.0.0.1}:${WHOOGLE_HOST_PORT:-5000}:5000"
    environment:
      WHOOGLE_CONFIG_DISABLE: "1"
      WHOOGLE_CONFIG_GET_ONLY: "1"
      WHOOGLE_CONFIG_SAFE: "1"
      WHOOGLE_MINIMAL: "1"
      WHOOGLE_TOR_SERVICE: "0"
      WHOOGLE_UPDATE_CHECK: "0"
    pids_limit: 50
    mem_limit: 256m
    memswap_limit: 256m
    user: whoogle
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /config/:size=10M,uid=927,gid=927,mode=1700
      - /var/lib/tor/:size=15M,uid=927,gid=927,mode=1700
      - /run/tor/:size=1M,uid=927,gid=927,mode=1700
    restart: unless-stopped

configs:
  searxng_settings:
    content: |
      use_default_settings: true

      general:
        instance_name: "HelpCore Search"

      search:
        safe_search: 1
        formats:
          - html
          - json

      server:
        secret_key: "overridden-by-SEARXNG_SECRET"
        limiter: false
        public_instance: false

volumes:
  helpcore_data:
  ollama_data:
  searxng_data:
  speaches_data:
