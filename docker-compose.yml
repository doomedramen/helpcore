services:
  helpcore:
    build: .
    ports:
      - "3000:3000"
    configs:
      - source: helpcore_config
        target: /config.toml
    volumes:
      - helpcore_data:/data
    environment:
      HELPCORE_CONFIG: /config.toml
      HELPCORE_DATA: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional: run Ollama alongside helpcore.
  # Start with: docker compose --profile with-ollama up
  # Then pull a model: docker compose exec ollama ollama pull llama3
  # Set url = "http://ollama:11434" in the [[providers]] section of config.toml.
  ollama:
    profiles: [with-ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  helpcore_data:
  ollama_data:

configs:
  helpcore_config:
    file: ./config.toml
