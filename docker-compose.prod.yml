# Production deployment — pulls the pre-built image from GHCR.
# This file is self-contained for Dockge and other source-less deployments.
# On first start the image creates ./config/config.toml with sensible defaults.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml --profile with-ollama up -d
#
# To update:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# With Ollama sidecar:
#   docker compose -f docker-compose.prod.yml --profile with-ollama up -d

services:
  helpcore:
    image: ${HELPCORE_IMAGE:-ghcr.io/doomedramen/helpcore:latest}
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
      - helpcore_data:/data
    environment:
      HELPCORE_CONFIG: /config/config.toml
      HELPCORE_DATA: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional Ollama sidecar — start with --profile with-ollama
  # Then: docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5:3b
  ollama:
    profiles: [with-ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      # Warn/error only. Set OLLAMA_DEBUG=0 to restore Ollama's info logs.
      OLLAMA_DEBUG: "${OLLAMA_DEBUG:--1}"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  helpcore_data:
  ollama_data:
