# Production deployment — pulls the pre-built image from GHCR.
# This file is self-contained for Dockge and other source-less deployments.
# On first start the image creates ./config/config.toml with sensible defaults.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml --profile with-ollama up -d
#
# To update:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# With Ollama sidecar:
#   docker compose -f docker-compose.prod.yml --profile with-ollama up -d
#
# With SearXNG sidecar (recommended self-hosted web search):
#   docker compose -f docker-compose.prod.yml --profile search up -d
#   Configure the web-search plugin with provider "searxng" and
#   base URL "http://searxng:8080".
#
# With Whoogle sidecar (experimental; Google may block it):
#   docker compose -f docker-compose.prod.yml --profile search-whoogle up -d
#   Configure provider "whoogle" and base URL "http://whoogle:5000".

services:
  helpcore:
    image: ${HELPCORE_IMAGE:-ghcr.io/doomedramen/helpcore:latest}
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
      - helpcore_data:/data
    environment:
      HELPCORE_CONFIG: /config/config.toml
      HELPCORE_DATA: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional Ollama sidecar — start with --profile with-ollama
  # Then: docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5:3b
  ollama:
    profiles: [with-ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      # Warn/error only. Set OLLAMA_DEBUG=0 to restore Ollama's info logs.
      OLLAMA_DEBUG: "${OLLAMA_DEBUG:--1}"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Recommended self-hosted search backend. JSON output is enabled by the
  # embedded settings file below; this private deployment does not need Valkey.
  searxng:
    profiles: [search]
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    ports:
      - "${SEARXNG_BIND_ADDRESS:-127.0.0.1}:${SEARXNG_HOST_PORT:-8080}:8080"
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-helpcore-local-search-change-me}"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    volumes:
      - searxng_data:/var/cache/searxng
    restart: unless-stopped

  # Experimental fallback. Whoogle's final release warns that Google often
  # blocks its no-JavaScript scraping, so prefer SearXNG for reliable use.
  whoogle:
    profiles: [search-whoogle]
    image: ${WHOOGLE_IMAGE:-benbusby/whoogle-search:1.2.4}
    ports:
      - "${WHOOGLE_BIND_ADDRESS:-127.0.0.1}:${WHOOGLE_HOST_PORT:-5000}:5000"
    environment:
      WHOOGLE_CONFIG_DISABLE: "1"
      WHOOGLE_CONFIG_GET_ONLY: "1"
      WHOOGLE_CONFIG_SAFE: "1"
      WHOOGLE_MINIMAL: "1"
      WHOOGLE_TOR_SERVICE: "0"
      WHOOGLE_UPDATE_CHECK: "0"
    pids_limit: 50
    mem_limit: 256m
    memswap_limit: 256m
    user: whoogle
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /config/:size=10M,uid=927,gid=927,mode=1700
      - /var/lib/tor/:size=15M,uid=927,gid=927,mode=1700
      - /run/tor/:size=1M,uid=927,gid=927,mode=1700
    restart: unless-stopped

configs:
  searxng_settings:
    content: |
      use_default_settings: true

      general:
        instance_name: "HelpCore Search"

      search:
        safe_search: 1
        formats:
          - html
          - json

      server:
        secret_key: "overridden-by-SEARXNG_SECRET"
        limiter: false
        public_instance: false

volumes:
  helpcore_data:
  ollama_data:
  searxng_data:
