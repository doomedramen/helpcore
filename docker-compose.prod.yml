# Production deployment — pulls the pre-built image from GHCR.
# This file is self-contained for Dockge and other source-less deployments.
# Set HELPCORE_URL in the stack environment to the URL used from your browser.
#
#   docker compose -f docker-compose.prod.yml pull
#   HELPCORE_URL=http://YOUR_SERVER_IP:3000 \
#     docker compose -f docker-compose.prod.yml --profile with-ollama up -d
#
# To update:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# With Ollama sidecar:
#   docker compose -f docker-compose.prod.yml --profile with-ollama up -d

services:
  helpcore:
    image: ${HELPCORE_IMAGE:-ghcr.io/doomedramen/helpcore:latest}
    ports:
      - "3000:3000"
    configs:
      - source: helpcore_config
        target: /config.toml
    volumes:
      - helpcore_data:/data
    environment:
      HELPCORE_CONFIG: /config.toml
      HELPCORE_DATA: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional Ollama sidecar — start with --profile with-ollama
  # Then: docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen2.5:3b
  ollama:
    profiles: [with-ollama]
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  helpcore_data:
  ollama_data:

configs:
  helpcore_config:
    content: |
      [server]
      name = "${HELPCORE_NAME:-My helpcore}"
      url = "${HELPCORE_URL:-http://localhost:3000}"
      port = 3000

      [logging]
      level = "${HELPCORE_LOG_LEVEL:-info}"

      [plugins]
      blacklist = []

      [[providers]]
      id = "ollama"
      name = "Ollama"
      type = "ollama"
      default_model = "${OLLAMA_MODEL:-qwen2.5:3b}"
      roles = ["chat"]
      url = "${OLLAMA_URL:-http://ollama:11434}"
      num_ctx = ${OLLAMA_NUM_CTX:-4096}
