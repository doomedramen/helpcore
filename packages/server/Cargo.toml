[package]
name         = "helpcore-server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description.workspace  = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation.workspace = true

[[bin]]
name = "helpcore-server"
path = "src/main.rs"

[lib]
name = "helpcore_server"
path = "src/lib.rs"

[dependencies]
helpcore-api     = { workspace = true }
anyhow           = { workspace = true }
argon2           = { workspace = true }
async-trait      = { workspace = true }
futures-util     = { workspace = true, features = ["sink"] }
axum             = { workspace = true, features = ["http1", "json", "tokio", "query", "macros"] }
chrono           = { workspace = true, features = ["clock", "std", "serde"] }
chrono-tz        = { workspace = true }
directories      = { workspace = true }
getrandom        = { workspace = true }
hex              = { workspace = true }
http-body-util   = { workspace = true }
hyper            = { workspace = true }
hyper-util       = { workspace = true }
parking_lot      = { workspace = true }
rand             = { workspace = true }
reqwest          = { workspace = true, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite         = { workspace = true }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }
sha2             = { workspace = true, features = ["std"] }
shellexpand      = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-stream     = { workspace = true, features = ["sync"] }
tokio-util       = { workspace = true, features = ["io"] }
toml             = { workspace = true }
tower            = { workspace = true, features = ["util"] }
tower-http       = { workspace = true, features = ["fs", "trace"] }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid             = { workspace = true, features = ["v4"] }
flate2           = { workspace = true }
tar              = { workspace = true }
semver           = { workspace = true }
chacha20poly1305  = { workspace = true }
base64           = { workspace = true }
wasmtime         = { workspace = true }
clap             = { workspace = true, features = ["derive"] }
mime_guess       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml     = { workspace = true }
tower    = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
