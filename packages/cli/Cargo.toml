[package]
name         = "helpcore-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "helpcore_cli"
path = "src/lib.rs"

[[bin]]
name = "helpcore"
path = "src/main.rs"

[[bin]]
name = "hc"
path = "src/bin/hc.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
